# Blueprint do Render: app inteiro (API + front no mesmo container Docker) + PostgreSQL.
# Não precisa de Vercel nem de VITE_API_URL: o front é servido pela própria API.
services:
  - type: web
    name: agendaki
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase: { name: agendaki-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: agendaki-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: agendaki-db, property: database }
      - key: DB_USER
        fromDatabase: { name: agendaki-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: agendaki-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false        # URL do próprio app no Render (links dos e-mails). Ex.: https://agendaki.onrender.com
      - key: MAIL_ENABLED
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"     # passe para "true" depois de preencher PHONE_NUMBER_ID e ACCESS_TOKEN (ver docs/WHATSAPP.md)
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false        # segredo: preencha só no painel do Render
      - key: WHATSAPP_TEMPLATE_NAME
        value: agendamento_confirmado
databases:
  - name: agendaki-db
    plan: free
