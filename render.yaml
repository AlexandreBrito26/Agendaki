# Blueprint do Render: app inteiro (API + front no mesmo container Docker) + PostgreSQL.
# Não precisa de Vercel nem de VITE_API_URL: o front é servido pela própria API.
services:
  - type: web
    name: agendaki
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase: { name: agendaki-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: agendaki-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: agendaki-db, property: database }
      - key: DB_USER
        fromDatabase: { name: agendaki-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: agendaki-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false        # URL do próprio app no Render (links dos e-mails). Ex.: https://agendaki.onrender.com
      - key: MAIL_ENABLED
        value: "false"
databases:
  - name: agendaki-db
    plan: free
