<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14532d" />
    <title>Agendaki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // aplica o tema salvo antes da primeira pintura (evita piscar)
      (function () {
        try {
          var ids = ['floresta','oceano','vinho','ambar','noite','meia-noite','grafite','ameixa'];
          var t = localStorage.getItem('agendaki-theme');
          if (ids.indexOf(t) < 0) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'noite' : 'floresta';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
