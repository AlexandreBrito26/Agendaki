spring:
  application:
    name: agendaki-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agendaki}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # o schema é controlado pelo Flyway
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-com-pelo-menos-32-bytes}
    expiration-minutes: 120
  booking:
    slot-step-minutes: 15     # de quantos em quantos minutos os horários são oferecidos
    max-days-ahead: 60        # até quantos dias à frente o cliente pode agendar
  public-url: ${PUBLIC_URL:http://localhost:5173}   # base dos links enviados por e-mail (o front)
  mail:
    enabled: ${MAIL_ENABLED:false}                  # false = só registra o e-mail no log
    from: ${MAIL_FROM:no-reply@agendaki.local}
  reminder:
    interval-ms: 900000                             # de 15 em 15 min
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
